[workspace]
# Must be explicit: a virtual manifest has no edition and would default to
# resolver 1. Resolver 3 also makes `cargo update` respect rust-version.
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# CI's MSRV job reads the first `rust-version` line in this file.
rust-version = "1.85"
authors = ["Julian Chultarsky"]
license = "MIT"
repository = "https://github.com/jchultarsky/fitment"
homepage = "https://github.com/jchultarsky/fitment"
# Published from M4 on (docs/research/m4-match.md, section 22.1): `fitment-core`
# first, then `fitment-catalog` (from 0.2.0, internal and unstable), then
# `fitment`. `fitment-server` and `fitment-corpus` say `publish = false`
# (docs/research/m6-api.md, M6-35, SC3): the server ships as the image that
# `.github/workflows/image.yml` pushes from a release's tag.
publish = true

# One version per dependency for the whole workspace, with the reason for any
# pin next to it. Members opt in with `foo = { workspace = true }`.
[workspace.dependencies]
# Internal crates: exact versions, released in lockstep.
fitment-core = { path = "crates/fitment-core", version = "=0.3.0" }
fitment-catalog = { path = "crates/fitment-catalog", version = "=0.3.0" }
# M7 (docs/research/m7-fit.md, FG1): the fit verifier's process and
# protocol, published from 0.4.0 after fitment-catalog and before fitment.
fitment-fit = { path = "crates/fitment-fit", version = "=0.3.0" }
# The corpus's scorer (docs/research/m6-api.md, SC3): never published, and
# without a version, so `cargo publish` strips it from every dev-dependency.
fitment-corpus = { path = "crates/fitment-corpus" }

# `default-features = false` must be set here: Cargo refuses it on a member
# that inherits the dependency, and stepq's default feature is its CLI.
stepq = { version = "0.6", default-features = false }

thiserror = "2"
# Correctly rounded transcendental functions, the same on every platform: a
# value at a tolerance edge must not judge differently on two systems.
libm = "0.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: socket files must parse back to the exact f64 that was
# written, or a value at the tolerance edge can move by one ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
# The catalog's database (docs/research/m5-catalog.md, DB1): SQLite built
# from source, so every platform runs the same engine. Only fitment-catalog
# may depend on it (deny.toml).
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# JSON Schema derives for the documents, behind each crate's `schema`
# feature only (docs/research/m6-api.md, CO4, CA6, VN7): the OpenAPI test
# turns it on, and no runtime build does (SV9).
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }

# fitment-server only (docs/research/m6-api.md, section 4.13): the one
# async crate (SV1), with the versions B's prototype built on Rust 1.85.
# Plain HTTP/1.1, no HTTP/2 and no TLS stack (HX1, SV9).
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros", "fs", "io-util"] }
# Without `json` (M6-34: it adds serde_json's `raw_value`), `http2`, `ws`
# or `multipart`.
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio", "tracing", "matched-path"] }
hyper = { version = "1.12", features = ["http1", "server"] }
# The plain `http1::Builder`, not `server-auto`, which pulls in `h2` (HX1).
hyper-util = { version = "0.1.21", features = ["server", "server-graceful", "tokio", "http1"] }
tower = { version = "0.5.3", default-features = false, features = ["limit", "timeout", "util"] }
# The handler timeout, the body check and the request id are the server's own,
# since each answers with the error document (HX2, HX3, HX7).
tower-http = { version = "0.7.1", features = ["trace", "sensitive-headers", "catch-panic", "cors"] }
http-body-util = "0.1"
getrandom = "0.4"
# Passwords (docs/research/m6-api.md, AU1): argon2id with the pepper as its
# secret. 0.6.0 is the version B's prototype built on Rust 1.85 (its MSRV);
# without its `getrandom` feature, since the salt comes from our own
# `getrandom` call.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
anyhow = "1"
# DC6 (docs/research/m6-api.md): `Content-Encoding: gzip` when a client
# asks, transport only; the pure-Rust backend (miniz_oxide), no C.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# Dev-only.
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# argon2 at AU1's parameters (19 MiB, two passes) takes seconds unoptimized;
# the server's tests hash on every login, so the debug build optimizes the
# hash's own crates, which changes no result.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
