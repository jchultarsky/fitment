[package]
name = "fitment"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Find catalog parts that can replace a part in a STEP assembly, by matching interfaces"
authors = ["Julian Chultarsky"]
license = "MIT"
repository = "https://github.com/jchultarsky/fitment"
readme = "README.md"
# Placeholder until the workspace layout (M0) is agreed; not published.
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
