[package]
name = "fitment-core"
description = "The fitment matcher: tests catalog parts against the interface an assembly requires of a part"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
# Only the library ships. tests/data holds STEP files that must never be
# published (tools/check-core.sh checks the package list).
include = ["src/**", "README.md", "LICENSE"]
keywords = ["step", "cad", "iso-10303", "interchangeability"]
categories = ["science", "mathematics"]

# Every crate this one may depend on is listed in deny/core.toml; CI fails on
# anything else. Adding one is a soundness change: say why in the PR.
[dependencies]
stepq = { workspace = true }
libm = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CO4 (docs/research/m6-api.md): the documents' JSON Schemas, behind the
# `schema` feature only; deny/core.toml allows schemars and its own
# dependencies for that feature alone.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
