# Clippy reads this file for fitment-core only, its tests included. It bans,
# in source, what the dependency allowlist (deny/core.toml) cannot: I/O,
# ambient state and nondeterminism. A local `#[allow]` with a comment is the
# escape hatch, and it shows up in review.

allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
  { path = "std::fs::File", reason = "fitment-core has no I/O; take bytes from the caller" },
  { path = "std::fs::OpenOptions", reason = "fitment-core has no I/O" },
  { path = "std::net::TcpStream", reason = "fitment-core has no network access" },
  { path = "std::net::TcpListener", reason = "fitment-core has no network access" },
  { path = "std::net::UdpSocket", reason = "fitment-core has no network access" },
  { path = "std::process::Command", reason = "fitment-core runs no processes; the fit helper lives in fitment-fit" },
  { path = "std::path::Path", reason = "fitment-core does not name files; take bytes from the caller" },
  { path = "std::path::PathBuf", reason = "fitment-core does not name files; take bytes from the caller" },
  { path = "std::collections::HashMap", reason = "random iteration order makes output nondeterministic; use BTreeMap" },
  { path = "std::collections::HashSet", reason = "random iteration order makes output nondeterministic; use BTreeSet" },
  { path = "std::hash::RandomState", reason = "randomly seeded; results must be deterministic" },
  { path = "std::hash::DefaultHasher", reason = "unspecified algorithm; results must be deterministic" },
  { path = "std::fs::DirBuilder", reason = "fitment-core has no I/O" },
  { path = "std::thread::Builder", reason = "fitment-core is single-threaded; callers parallelize" },
  { path = "std::os::unix::net::UnixStream", reason = "fitment-core has no network access", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener", reason = "fitment-core has no network access", allow-invalid = true },
  { path = "std::os::unix::net::UnixDatagram", reason = "fitment-core has no network access", allow-invalid = true },
]

disallowed-methods = [
  { path = "std::fs::read", reason = "fitment-core has no I/O" },
  { path = "std::fs::read_to_string", reason = "fitment-core has no I/O" },
  { path = "std::fs::write", reason = "fitment-core has no I/O" },
  { path = "std::fs::read_dir", reason = "fitment-core has no I/O" },
  { path = "std::fs::metadata", reason = "fitment-core has no I/O" },
  { path = "std::fs::create_dir_all", reason = "fitment-core has no I/O" },
  { path = "std::fs::remove_file", reason = "fitment-core has no I/O" },
  { path = "std::fs::rename", reason = "fitment-core has no I/O" },
  { path = "std::fs::copy", reason = "fitment-core has no I/O" },
  { path = "std::fs::exists", reason = "fitment-core has no I/O" },
  { path = "std::fs::canonicalize", reason = "fitment-core has no I/O" },
  { path = "std::fs::read_link", reason = "fitment-core has no I/O" },
  { path = "std::fs::symlink_metadata", reason = "fitment-core has no I/O" },
  { path = "std::fs::create_dir", reason = "fitment-core has no I/O" },
  { path = "std::fs::remove_dir", reason = "fitment-core has no I/O" },
  { path = "std::fs::remove_dir_all", reason = "fitment-core has no I/O" },
  { path = "std::fs::hard_link", reason = "fitment-core has no I/O" },
  { path = "std::fs::set_permissions", reason = "fitment-core has no I/O" },
  { path = "std::env::var", reason = "results must not depend on the environment" },
  { path = "std::env::var_os", reason = "results must not depend on the environment" },
  { path = "std::env::vars", reason = "results must not depend on the environment" },
  { path = "std::env::args", reason = "results must not depend on the environment" },
  { path = "std::env::args_os", reason = "results must not depend on the environment" },
  { path = "std::env::current_dir", reason = "results must not depend on the environment" },
  { path = "std::env::vars_os", reason = "results must not depend on the environment" },
  { path = "std::env::temp_dir", reason = "results must not depend on the environment" },
  { path = "std::env::home_dir", reason = "results must not depend on the environment" },
  { path = "std::env::current_exe", reason = "results must not depend on the environment" },
  { path = "std::env::set_current_dir", reason = "a library never changes process state" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "fitment-core has no network access" },
  { path = "std::process::id", reason = "results must not depend on the process" },
  { path = "std::process::abort", reason = "a library never ends the process" },
  { path = "std::thread::spawn", reason = "fitment-core is single-threaded; callers parallelize" },
  { path = "std::thread::scope", reason = "fitment-core is single-threaded; callers parallelize" },
  { path = "std::thread::sleep", reason = "results must not depend on the clock" },
  { path = "std::thread::available_parallelism", reason = "results must not depend on the machine" },
  { path = "std::time::Instant::now", reason = "results must not depend on the clock" },
  { path = "std::time::SystemTime::now", reason = "results must not depend on the clock" },
  { path = "std::time::SystemTime::elapsed", reason = "results must not depend on the clock" },
  { path = "std::io::stdin", reason = "fitment-core has no I/O" },
  { path = "std::io::stdout", reason = "fitment-core has no I/O" },
  { path = "std::io::stderr", reason = "fitment-core has no I/O" },
  { path = "std::process::exit", reason = "a library never exits the process" },
  # The platform libm decides these results, so a value at the tolerance edge
  # could judge differently on two operating systems. Use the libm crate.
  # sqrt, abs and mul_add are correctly rounded everywhere and stay allowed.
  { path = "f64::sin", reason = "platform-dependent rounding; use libm::sin" },
  { path = "f64::cos", reason = "platform-dependent rounding; use libm::cos" },
  { path = "f64::tan", reason = "platform-dependent rounding; use libm::tan" },
  { path = "f64::asin", reason = "platform-dependent rounding; use libm::asin" },
  { path = "f64::acos", reason = "platform-dependent rounding; use libm::acos" },
  { path = "f64::atan", reason = "platform-dependent rounding; use libm::atan" },
  { path = "f64::atan2", reason = "platform-dependent rounding; use libm::atan2" },
  { path = "f64::sin_cos", reason = "platform-dependent rounding; use libm::sincos" },
  { path = "f64::exp", reason = "platform-dependent rounding; use libm::exp" },
  { path = "f64::exp_m1", reason = "platform-dependent rounding; use libm::expm1" },
  { path = "f64::ln", reason = "platform-dependent rounding; use libm::log" },
  { path = "f64::ln_1p", reason = "platform-dependent rounding; use libm::log1p" },
  { path = "f64::log", reason = "platform-dependent rounding; use libm" },
  { path = "f64::log2", reason = "platform-dependent rounding; use libm::log2" },
  { path = "f64::log10", reason = "platform-dependent rounding; use libm::log10" },
  { path = "f64::powf", reason = "platform-dependent rounding; use libm::pow" },
  { path = "f64::powi", reason = "platform-dependent rounding; multiply explicitly" },
  { path = "f64::cbrt", reason = "platform-dependent rounding; use libm::cbrt" },
  { path = "f64::hypot", reason = "platform-dependent rounding; use libm::hypot" },
  { path = "f64::sinh", reason = "platform-dependent rounding; use libm::sinh" },
  { path = "f64::cosh", reason = "platform-dependent rounding; use libm::cosh" },
  { path = "f64::tanh", reason = "platform-dependent rounding; use libm::tanh" },
  { path = "f64::asinh", reason = "platform-dependent rounding; use libm::asinh" },
  { path = "f64::acosh", reason = "platform-dependent rounding; use libm::acosh" },
  { path = "f64::atanh", reason = "platform-dependent rounding; use libm::atanh" },
  { path = "f64::exp2", reason = "platform-dependent rounding; use libm::exp2" },
  # f32 has the same problem, and f32 should not appear in the matcher at all.
  { path = "f32::sin", reason = "platform-dependent rounding; use libm::sinf" },
  { path = "f32::cos", reason = "platform-dependent rounding; use libm::cosf" },
  { path = "f32::tan", reason = "platform-dependent rounding; use libm::tanf" },
  { path = "f32::asin", reason = "platform-dependent rounding; use libm::asinf" },
  { path = "f32::acos", reason = "platform-dependent rounding; use libm::acosf" },
  { path = "f32::atan", reason = "platform-dependent rounding; use libm::atanf" },
  { path = "f32::atan2", reason = "platform-dependent rounding; use libm::atan2f" },
  { path = "f32::sin_cos", reason = "platform-dependent rounding; use libm::sincosf" },
  { path = "f32::exp", reason = "platform-dependent rounding; use libm::expf" },
  { path = "f32::exp2", reason = "platform-dependent rounding; use libm::exp2f" },
  { path = "f32::exp_m1", reason = "platform-dependent rounding; use libm::expm1f" },
  { path = "f32::ln", reason = "platform-dependent rounding; use libm::logf" },
  { path = "f32::ln_1p", reason = "platform-dependent rounding; use libm::log1pf" },
  { path = "f32::log", reason = "platform-dependent rounding; use libm" },
  { path = "f32::log2", reason = "platform-dependent rounding; use libm::log2f" },
  { path = "f32::log10", reason = "platform-dependent rounding; use libm::log10f" },
  { path = "f32::powf", reason = "platform-dependent rounding; use libm::powf" },
  { path = "f32::powi", reason = "platform-dependent rounding; multiply explicitly" },
  { path = "f32::cbrt", reason = "platform-dependent rounding; use libm::cbrtf" },
  { path = "f32::hypot", reason = "platform-dependent rounding; use libm::hypotf" },
  { path = "f32::sinh", reason = "platform-dependent rounding; use libm::sinhf" },
  { path = "f32::cosh", reason = "platform-dependent rounding; use libm::coshf" },
  { path = "f32::tanh", reason = "platform-dependent rounding; use libm::tanhf" },
  { path = "f32::asinh", reason = "platform-dependent rounding; use libm::asinhf" },
  { path = "f32::acosh", reason = "platform-dependent rounding; use libm::acoshf" },
  { path = "f32::atanh", reason = "platform-dependent rounding; use libm::atanhf" },
]

disallowed-macros = [
  { path = "std::option_env", reason = "results must not depend on the build environment" },
  { path = "std::thread_local", reason = "no global state; pass values explicitly" },
]
