[package]
name = "fitment"
description = "Find catalog parts that can replace a part in a STEP assembly, by matching interfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "../../README.md"
# docs.rs does not document binary-only crates; the library's docs are the API.
documentation = "https://docs.rs/fitment-core"
keywords = ["step", "cad", "iso-10303", "interchangeability", "cli"]
categories = ["command-line-utilities", "science"]
# Only the binary's source ships: tests/ needs the repository (its goldens,
# corpus and fixtures), and tools/check-core.sh checks the package list.
include = ["src/**", "LICENSE"]

[[bin]]
name = "fitment"
path = "src/main.rs"

# The CLI never depends on stepq directly (deny.toml) and never on an async
# runtime: the server is a separate package.
[dependencies]
fitment-core = { workspace = true }
clap = { workspace = true }
# The table view names values as the document does; both already build for
# fitment-core.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
