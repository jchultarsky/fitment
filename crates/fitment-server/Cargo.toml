[package]
name = "fitment-server"
description = "fitment's REST API: jobs over the catalog and the matcher (never published; shipped as a container image)"
version.workspace = true
edition.workspace = true
# 1.87, above the workspace's 1.85: argon2's ctutils is fixed for
# RUSTSEC-2026-0385 only from 0.4.3, which needs 1.87. The server is never
# published, and its image builds with 1.87 (deploy/Containerfile); the
# published crates keep the workspace's MSRV (CI's MSRV job).
rust-version = "1.87"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# M6-35 (docs/research/m6-api.md): never published, shipped only as a
# container image (deploy/Containerfile). Explicit: the workspace's default
# is to publish.
publish = false

[package.metadata.dist]
dist = false

[[bin]]
name = "fitment-server"
path = "src/main.rs"

[features]
# CO4, CA6, VN7: the documents' JSON Schemas, for the OpenAPI test only.
# No runtime build turns it on (SV9).
schema = ["dep:schemars", "fitment-core/schema", "fitment-catalog/schema"]
# OP11: the test seams (a fixed clock and ids, hook points, shutdown on
# stdin's end of file), and core's test-only fit verifier (VT31). Never in
# a release build or the image (VT29).
test-support = ["fitment-core/test-support"]

[dependencies]
fitment-core = { workspace = true }
fitment-catalog = { workspace = true }
# server.db (M6-32, SV6): only state/db.rs names it.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http-body-util = { workspace = true }
getrandom = { workspace = true }
# AU1's passwords.
argon2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
# main.rs only (decision 11).
anyhow = { workspace = true }
# DC6's transport compression.
flate2 = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
# The seams, in every test (OP11).
fitment-server = { path = ".", features = ["test-support"] }
fitment-catalog = { workspace = true, features = ["test-support"] }
# The tests' HTTP client over the bound socket and the process (M6-40).
hyper-util = { workspace = true, features = ["client-legacy"] }
rusqlite = { workspace = true }
# The JSON Schema validator for VT36 (R14, question 9), and XH13's scan.
fitment-corpus = { workspace = true }

[[test]]
name = "openapi"
required-features = ["schema"]

[lints]
workspace = true
