name: Scale

# CT11 (docs/research/m5-catalog.md, section 8.3): a 10⁴-part catalog of
# scaled corpus parts, every corpus socket run against it with level 1 and
# exhaustively, compared by digest. M6's weekly legs (docs/research/
# m6-api.md, section 11.2; PR 8): the same catalog through the API (VT27,
# VT28), the restart soak (VT10) and a full disk (VT11). Weekly, and on
# request; 10⁵ is run by hand (each test's header says how).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scale:
    name: 10⁴ scaled parts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - run: tools/scale-step.py corpus/out "$RUNNER_TEMP/scaled" 10000 --manifest corpus/out/manifest.json
      - run: cargo test --release -p fitment --test catalog_scale --locked -- --nocapture
        env:
          FITMENT_SCALE_DIR: ${{ runner.temp }}/scaled

  server-scale:
    name: 10⁴ scaled parts through the API
    # VT27, VT28 (M6-45): the catalog ingested by the built server, every
    # corpus socket's full run the CLI's document on it and within twice
    # its time and a second, the widest socket's exhaustive document
    # downloaded, then sixteen clients for two minutes; timings, the
    # server's peak memory and the load's percentiles reported, the gates
    # order-of-magnitude ceilings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - run: tools/scale-step.py corpus/out "$RUNNER_TEMP/scaled" 10000 --manifest corpus/out/manifest.json
      - run: cargo build --release -p fitment -p fitment-server --locked
      - run: cargo test --release -p fitment-server --test scale --locked -- --nocapture
        env:
          FITMENT_SCALE_DIR: ${{ runner.temp }}/scaled
          FITMENT_REQUIRE_CORPUS: "1"

  soak:
    name: restart soak
    # VT10 (JB6, JS11, JS13, SD1 to SD5, XH12): 100 rounds of jobs of every
    # pure kind and a catalog ingest, the built server killed at a
    # pseudo-random time in each and started again; every job ends once,
    # as it ended before, and the catalog verifies clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fitment-server --test soak --locked restarts_at_random_times_keep_every_job -- --nocapture
        env:
          FITMENT_SOAK_ROUNDS: "100"

  full-disk:
    name: a full disk
    # VT11 (UP2, UP4, OB2, OB5; M6-44): a real 32 MiB tmpfs as the state
    # directory, filled by uploads until refused `storage_full`; the server
    # stays up, and once space is freed an ingest and a match succeed and
    # the catalog verifies clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mount a 32 MiB tmpfs
        run: |
          sudo mkdir -p /mnt/fitment-tmpfs
          sudo mount -t tmpfs -o size=32m,mode=0700 tmpfs /mnt/fitment-tmpfs
          sudo chown "$(id -u):$(id -g)" /mnt/fitment-tmpfs
      - run: cargo test -p fitment-server --test soak --locked a_full_disk_refuses_then_recovers -- --nocapture
        env:
          FITMENT_TMPFS: /mnt/fitment-tmpfs
