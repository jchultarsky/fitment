name: Scale

# CT11 (docs/research/m5-catalog.md, section 8.3): a 10⁴-part catalog of
# scaled corpus parts, every corpus socket run against it with level 1 and
# exhaustively, compared by digest. M6's weekly legs (docs/research/
# m6-api.md, section 11.2; PR 8): the same catalog through the API (VT27,
# VT28), the restart soak (VT10), a full disk (VT11) and many clients over
# the corpus (VT14). M7's weekly legs (docs/research/m7-fit.md, section 7):
# the same catalog with the real helper (VT79) and the fit's corpus on
# Windows (VT77, M7-50). Weekly, and on request; 10⁵ is run by hand (each
# test's header says how).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scale:
    name: 10⁴ scaled parts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - run: tools/scale-step.py corpus/out "$RUNNER_TEMP/scaled" 10000 --manifest corpus/out/manifest.json
      - run: cargo test --release -p fitment --test catalog_scale --locked -- --nocapture
        env:
          FITMENT_SCALE_DIR: ${{ runner.temp }}/scaled

  server-scale:
    name: 10⁴ scaled parts through the API
    # VT27, VT28 (M6-45): the catalog ingested by the built server, every
    # corpus socket's full run the CLI's document on it and within twice
    # its time and a second, the widest socket's exhaustive document
    # downloaded, then sixteen clients for two minutes; timings, the
    # server's peak memory and the load's percentiles reported, the gates
    # order-of-magnitude ceilings. CI's 4-vCPU runners give
    # query_slots = 1, so the load queues behind one slot.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - run: tools/scale-step.py corpus/out "$RUNNER_TEMP/scaled" 10000 --manifest corpus/out/manifest.json
      - run: cargo build --release -p fitment -p fitment-server --locked
      - run: cargo test --release -p fitment-server --test scale --locked -- --nocapture
        env:
          FITMENT_SCALE_DIR: ${{ runner.temp }}/scaled
          FITMENT_REQUIRE_CORPUS: "1"

  soak:
    name: restart soak
    # VT10 (JB6, JS11, JS13, SD1 to SD5, XH12): 100 rounds of jobs of every
    # pure kind and a catalog ingest, the built server killed at a
    # pseudo-random time in each and started again; every job ends once,
    # as it ended before, and the catalog verifies clean.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fitment-server --test soak --locked restarts_at_random_times_keep_every_job -- --nocapture
        env:
          FITMENT_SOAK_ROUNDS: "100"

  full-disk:
    name: a full disk
    # VT11 (UP2, UP4, OB2, OB5; M6-44): a real 32 MiB tmpfs as the state
    # directory, filled by uploads until refused `storage_full`; the server
    # stays up, and once space is freed an ingest and a match succeed and
    # the catalog verifies clean.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mount a 32 MiB tmpfs
        run: |
          sudo mkdir -p /mnt/fitment-tmpfs
          sudo mount -t tmpfs -o size=32m,mode=0700 tmpfs /mnt/fitment-tmpfs
          sudo chown "$(id -u):$(id -g)" /mnt/fitment-tmpfs
      - run: cargo test -p fitment-server --test soak --locked a_full_disk_refuses_then_recovers -- --nocapture
        env:
          FITMENT_TMPFS: /mnt/fitment-tmpfs

  server-corpus-load:
    name: many clients over the corpus
    # VT14 on the corpus (JS1 to JS5; the review of PR 8 moved it here
    # from CI's per-PR server-corpus job, where 4-vCPU runners took about
    # ten minutes): 32 clients, each its own user, every file-candidate
    # socket under both policies, interleaved; every document the
    # sequential pass's, the caps held. Per PR, the committed set's VT14
    # (concurrency.rs::many_clients_extract_the_same_sockets) still runs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - run: cargo test --release -p fitment-server --test concurrency --locked many_clients_match_the_corpus_alike -- --nocapture
        env:
          FITMENT_REQUIRE_CORPUS: "1"

  fit:
    name: 10⁴ scaled parts with the fit
    # VT79 (R8): the scaled catalog with the real helper; every corpus
    # socket's full run with the fit is the file run with it over level 1's
    # survivors, digest for digest; the fits, their time each and in all
    # reported.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - run: tools/scale-step.py corpus/out "$RUNNER_TEMP/scaled" 10000 --manifest corpus/out/manifest.json
      - run: cargo build --release -p fitment --locked
      - run: target/release/fitment fit setup --fit-dir "$RUNNER_TEMP/fit"
      - run: cargo test --release -p fitment --test catalog_scale --locked -- --nocapture a_scaled_catalog_with_the_fit
        env:
          FITMENT_SCALE_DIR: ${{ runner.temp }}/scaled
          FITMENT_FIT_DIR: ${{ runner.temp }}/fit

  fit-corpus:
    name: the corpus for the fit's Windows run
    # VT77 compares Windows' digests with Ubuntu's: both judge one corpus,
    # generated here once, since the generator's numbers may differ by
    # 1e-9 between platforms (as ci.yml's corpus-gen).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: tools/gen-corpus.py corpus/out
      - uses: actions/upload-artifact@v7
        with:
          name: fit-corpus
          path: corpus/out
          retention-days: 7
          if-no-files-found: error

  fit-windows:
    name: the fit's corpus on Windows
    # VT77 (M7-50): the fit job's library path on Windows, the real helper
    # let through in the test build alone (FITMENT_FIT_WINDOWS_PROOF=1; the
    # release binary still refuses it), its digests compared with
    # Ubuntu's, both on fit-corpus's one corpus. Until this run is green the
    # helper on Windows answers helper_unavailable, so no fit is verified
    # there.
    needs: fit-corpus
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8
        with:
          name: fit-corpus
          path: corpus/out
      - run: cargo build --release -p fitment --locked
      - run: target/release/fitment fit setup --fit-dir "$RUNNER_TEMP/fit"
        shell: bash
        # On Windows setup states M7-50's refusal and exits 0 with it.
      - run: cargo test --release -p fitment --test fit_corpus --test fit_original --locked -- --nocapture --test-threads 1
        shell: bash
        env:
          FITMENT_REQUIRE_FIT: "1"
          FITMENT_REQUIRE_CORPUS: "1"
          FITMENT_FIT_DIR: ${{ runner.temp }}/fit
          FITMENT_FIT_WINDOWS_PROOF: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fit-windows-${{ matrix.os }}
          path: |
            target/fitment-corpus/fit-report.json
            target/fitment-corpus/fit-digests.json
          retention-days: 14
          if-no-files-found: error

  fit-windows-digests:
    name: the fit's digests equal on Windows and Ubuntu
    # VT77: Windows' decisions are Ubuntu's, document by document.
    needs: fit-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fit-windows-*
      - run: diff fit-windows-ubuntu-latest/fit-digests.json fit-windows-windows-latest/fit-digests.json
