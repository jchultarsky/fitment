name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  corpus:
    name: test parts and Open CASCADE oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no moving major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          # The downloads only: a restored copy of the tracked manifest
          # would overwrite the one being tested.
          path: |
            fixtures/nist
            fixtures/nist-edm
            fixtures/steptools
          key: fixtures-${{ hashFiles('tools/fetch-fixtures.sh') }}
      - run: tools/fetch-fixtures.sh core
      # Every test part, with answers from the construction alone.
      - run: tools/gen-corpus.py corpus/out
      # Open CASCADE 8.0.1, a kernel the generator does not use, reads every
      # part as its construction says: this catches generator bugs.
      - run: tools/verify-occt.py manifest corpus/out
      # fitment against Open CASCADE: planes, cylinders, holes and shafts, on
      # the corpus (with its pcurve and rotated variants) and on the
      # fixtures, whose tallies are pinned.
      - run: cargo build --release -p fitment --locked
      - run: tools/verify-occt.py features corpus/out
      - run: tools/verify-occt.py features --expect fixtures/manifest.json fixtures
      - run: tools/verify-occt.py socket corpus/out
      - run: tools/verify-occt.py socket --expect fixtures/manifest.json fixtures
      - run: cargo test -p fitment --test corpus --test fixtures --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
          FITMENT_REQUIRE_FIXTURES: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: corpus
          path: corpus/out
          retention-days: 7
          if-no-files-found: error

  unit-set:
    name: unit set matches the generator
    # Its own job, so that a difference shows here without holding back
    # every test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      # The same files, but for the last digit of a number: Open CASCADE's
      # trigonometry rounds by the platform's maths library.
      - run: tools/gen-corpus.py --unit-set "$RUNNER_TEMP/unit" --check crates/fitment-core/tests/data
      - run: tools/gen-corpus.py --assembly-set "$RUNNER_TEMP/assemblies" --check crates/fitment-core/tests/assemblies

  test:
    name: test (${{ matrix.os }})
    # The generated corpus runs on every OS from the artifact, without Python.
    needs: corpus
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - run: cargo test --workspace --all-features --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # rust-toolchain.toml pins stable, and it outranks the toolchain the step
      # above installs unless RUSTUP_TOOLCHAIN is set. Without this, the job
      # checks with stable and passes vacuously.
      - name: Use the MSRV toolchain over rust-toolchain.toml
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.name }}" >> "$GITHUB_ENV"
      - name: Assert the MSRV toolchain is active
        run: rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }}\." || { rustc --version; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary rather than EmbarkStudios/cargo-deny-action, which
      # builds a Docker image and fails when Docker Hub rate-limits the pull.
      # Pinned so a new cargo-deny cannot change what the configs mean.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
      # fitment-core: its dependency allowlist (alone and as the workspace
      # builds it), banned std modules, async code and global state.
      - name: fitment-core checks
        run: tools/check-core.sh
