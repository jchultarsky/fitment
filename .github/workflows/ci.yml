name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # M5's CT20: the CLI builds without the catalog and its SQLite.
      - run: cargo clippy -p fitment --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test -p fitment --no-default-features --locked --test no_catalog
      # M6's server without its features: no schema, no test seams in the
      # library (docs/research/m6-api.md, section 11.2).
      - run: cargo clippy -p fitment-server --all-targets --no-default-features --locked -- -D warnings

  corpus:
    name: test parts and Open CASCADE oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no moving major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          # The downloads only: a restored copy of the tracked manifest
          # would overwrite the one being tested.
          path: |
            fixtures/nist
            fixtures/nist-edm
            fixtures/steptools
          key: fixtures-${{ hashFiles('tools/fetch-fixtures.sh') }}
      - run: tools/fetch-fixtures.sh core
      # Every test part, with answers from the construction alone.
      - run: tools/gen-corpus.py corpus/out
      # Open CASCADE 8.0.1, a kernel the generator does not use, reads every
      # part as its construction says: this catches generator bugs.
      - run: tools/verify-occt.py manifest corpus/out
      # fitment against Open CASCADE: planes, cylinders, holes and shafts, on
      # the corpus (with its pcurve and rotated variants) and on the
      # fixtures, whose tallies are pinned.
      - run: cargo build --release -p fitment --locked
      - run: tools/verify-occt.py features corpus/out
      - run: tools/verify-occt.py features --expect fixtures/manifest.json fixtures
      - run: tools/verify-occt.py socket corpus/out
      # Every mutation of fitment's sockets meets a disagreement.
      - run: tools/verify-occt.py mutations corpus/out
      - run: tools/verify-occt.py socket --expect fixtures/manifest.json fixtures
      # fitment's match documents against Open CASCADE: every pass fits at the
      # placement it states, its features on their requirements, and every
      # mutation of a document meets a disagreement (KO3, KO5, KO6).
      - run: tools/verify-occt.py match corpus/out
      # AS1's parts across its six exports, each component written alone: the
      # same checks, with the tallies pinned (KO8).
      - run: tools/verify-occt.py match --expect fixtures/manifest.json fixtures
      # In release: the corpus's match runs take most of an hour unoptimised.
      - run: cargo test --release -p fitment --test corpus --test fixtures --test shortlist --test original --test matching --test catalog_corpus --test observer --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
          FITMENT_REQUIRE_FIXTURES: "1"
      # Every corpus file uploads under the SHA-256 the test computes
      # (docs/research/m6-api.md, PR 4's "done when"; UP2, CO1).
      - run: cargo test --release -p fitment-server --test api --locked every_corpus_file_uploads_with_its_sha256
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # Every corpus assembly's fitment.parts and socket through jobs are
      # the CLI's bytes (docs/research/m6-api.md, PR 5's "done when"; DC1,
      # JB4).
      - run: cargo test --release -p fitment-server --test parity --locked every_corpus_source_is_the_clis_through_jobs
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: corpus
          path: corpus/out
          retention-days: 7
          if-no-files-found: error
      # The library's report (KH6), which the API's must equal from M6's
      # PR 6 on (docs/research/m6-api.md, XH6, VT3).
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: target/fitment-corpus/report.json
          retention-days: 7
          if-no-files-found: error

  server-corpus:
    name: the corpus through the API
    # VT1, VT2, VT3 (docs/research/m6-api.md, XH1 to XH11, M6-36): the
    # exit's file half and its catalog half (XH8: the corpus ingested, its
    # full, exhaustive and named runs under three policies the CLI's on the
    # server's catalog, `verify --deep` clean after) through the built
    # server, a child over loopback, in release; the API's report must
    # equal the library's, byte for byte.
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - uses: actions/download-artifact@v8
        with:
          name: corpus-report
          path: library-report
      - run: cargo build --release -p fitment -p fitment-server --locked
      - run: cargo test --release -p fitment-server --test exit --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # VT22: the hostile parts as uploaded candidates, the CLI's bytes.
      - run: cargo test --release -p fitment-server --test hostile --locked hostile_parts_through_the_api_are_the_clis
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      - run: diff library-report/report.json target/fitment-corpus/api-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: target/fitment-corpus/api-report.json
          retention-days: 7
          if-no-files-found: error

  unit-set:
    name: unit set matches the generator
    # Its own job, so that a difference shows here without holding back
    # every test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      # The same files, but for the last digit of a number: Open CASCADE's
      # trigonometry rounds by the platform's maths library.
      - run: tools/gen-corpus.py --unit-set "$RUNNER_TEMP/unit" --check crates/fitment-core/tests/data
      - run: tools/gen-corpus.py --assembly-set "$RUNNER_TEMP/assemblies" --check crates/fitment-core/tests/assemblies
      - run: tools/gen-corpus.py --candidate-set "$RUNNER_TEMP/candidates" --check crates/fitment-core/tests/candidates

  test:
    name: test (${{ matrix.os }})
    # The generated corpus runs on every OS from the artifact, without Python.
    needs: corpus
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - run: cargo test --workspace --all-features --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # VT36: the OpenAPI document is the committed one, and every document
      # validates against its schema; behind the `schema` feature, so named
      # explicitly (docs/research/m6-api.md, section 11.2).
      - run: cargo test -p fitment-server --features schema --test openapi --locked
      # VT8: the API's own documents, compared across the three operating
      # systems by the determinism job.
      - run: tools/api-outputs.sh api-outputs
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: api-outputs-${{ matrix.os }}
          path: api-outputs
          retention-days: 7
          if-no-files-found: error
      # CT7: one ingest sequence's catalog outputs, compared across the three
      # operating systems by the determinism job.
      - run: cargo build -p fitment --locked
      - run: tools/catalog-outputs.sh catalog-outputs
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-outputs-${{ matrix.os }}
          path: catalog-outputs
          retention-days: 7
          if-no-files-found: error

  determinism:
    name: catalog and API outputs equal on every OS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: catalog-outputs-*
      - run: diff -r catalog-outputs-ubuntu-latest catalog-outputs-macos-latest
      - run: diff -r catalog-outputs-ubuntu-latest catalog-outputs-windows-latest
      # VT8 (docs/research/m6-api.md): the API's documents, byte for byte.
      - uses: actions/download-artifact@v8
        with:
          pattern: api-outputs-*
      - run: diff -r api-outputs-ubuntu-latest api-outputs-macos-latest
      - run: diff -r api-outputs-ubuntu-latest api-outputs-windows-latest

  container:
    name: container image
    # VT29 (docs/research/m6-api.md; OP8, M6-43): the image as shipped,
    # built without test seams and smoke-tested; pushed only by the user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Containerfile -t fitment-server:ci .
      - run: deploy/smoke.sh fitment-server:ci

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # rust-toolchain.toml pins stable, and it outranks the toolchain the step
      # above installs unless RUSTUP_TOOLCHAIN is set. Without this, the job
      # checks with stable and passes vacuously.
      - name: Use the MSRV toolchain over rust-toolchain.toml
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.name }}" >> "$GITHUB_ENV"
      - name: Assert the MSRV toolchain is active
        run: rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }}\." || { rustc --version; exit 1; }
      - uses: Swatinem/rust-cache@v2
      # fitment-server states its own, higher rust-version: the next job.
      - run: cargo check --workspace --exclude fitment-server --all-features --locked

  # fitment-server's own rust-version (1.87, for RUSTSEC-2026-0385's fix in
  # argon2's ctutils): it is never published, and its image builds with it.
  msrv-server:
    name: MSRV (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from fitment-server's Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' crates/fitment-server/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Use the MSRV toolchain over rust-toolchain.toml
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.name }}" >> "$GITHUB_ENV"
      - name: Assert the MSRV toolchain is active
        run: rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }}\." || { rustc --version; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p fitment-server --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both crates packaged as crates.io would take them, and each built from
      # its .crate: fitment against fitment-core's through Cargo's local
      # registry overlay (docs/research/m4-match.md, section 22.1).
      # fitment-corpus and fitment-server are never published
      # (docs/research/m6-api.md, SC3, M6-35), and `cargo package` does not
      # skip either by itself.
      - run: cargo package --workspace --exclude fitment-corpus --exclude fitment-server --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary rather than EmbarkStudios/cargo-deny-action, which
      # builds a Docker image and fails when Docker Hub rate-limits the pull.
      # Pinned so a new cargo-deny cannot change what the configs mean.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
      # fitment-core: its dependency allowlist (alone and as the workspace
      # builds it), banned std modules, async code and global state.
      - name: fitment-core checks
        run: tools/check-core.sh
