name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # M5's CT20: the CLI builds without the catalog and its SQLite.
      - run: cargo clippy -p fitment --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test -p fitment --no-default-features --locked --test no_catalog --test no_fit
      # M7's FG3: the CLI with either default feature alone.
      - run: cargo clippy -p fitment --all-targets --no-default-features --features fit --locked -- -D warnings
      - run: cargo clippy -p fitment --all-targets --no-default-features --features catalog --locked -- -D warnings
      # M6's server without its features: no schema, no test seams in the
      # library (docs/research/m6-api.md, section 11.2).
      - run: cargo clippy -p fitment-server --all-targets --no-default-features --locked -- -D warnings
      # M7's fitment-fit as published, without its test support (its own
      # tests turn that on, so only the library alone shows what it lacks;
      # docs/research/m7-fit.md, FG1).
      - run: cargo clippy -p fitment-fit --lib --no-default-features --locked -- -D warnings

  corpus-gen:
    name: the corpus
    # M7-26 (docs/research/m7-fit.md, section 7, the feasibility review's
    # M6): the corpus is generated once, here, and every job that judges it
    # (the oracle, the tests on three OSes, the fit job) takes it from this
    # artifact rather than generating it again.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      # Every test part, with answers from the construction alone.
      - run: tools/gen-corpus.py corpus/out
      - uses: actions/upload-artifact@v7
        with:
          name: corpus
          path: corpus/out
          retention-days: 7
          if-no-files-found: error

  corpus:
    name: test parts and Open CASCADE oracle
    needs: corpus-gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # setup-uv publishes no moving major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          # The downloads only: a restored copy of the tracked manifest
          # would overwrite the one being tested.
          path: |
            fixtures/nist
            fixtures/nist-edm
            fixtures/steptools
          key: fixtures-${{ hashFiles('tools/fetch-fixtures.sh') }}
      - run: tools/fetch-fixtures.sh core
      # Open CASCADE 8.0.1, a kernel the generator does not use, reads every
      # part as its construction says: this catches generator bugs.
      - run: tools/verify-occt.py manifest corpus/out
      # fitment against Open CASCADE: planes, cylinders, holes and shafts, on
      # the corpus (with its pcurve and rotated variants) and on the
      # fixtures, whose tallies are pinned.
      - run: cargo build --release -p fitment --locked
      - run: tools/verify-occt.py features corpus/out
      - run: tools/verify-occt.py features --expect fixtures/manifest.json fixtures
      - run: tools/verify-occt.py socket corpus/out
      # Every mutation of fitment's sockets meets a disagreement.
      - run: tools/verify-occt.py mutations corpus/out
      - run: tools/verify-occt.py socket --expect fixtures/manifest.json fixtures
      # fitment's match documents against Open CASCADE: every pass fits at the
      # placement it states, its features on their requirements, and every
      # mutation of a document meets a disagreement (KO3, KO5, KO6).
      - run: tools/verify-occt.py match corpus/out
      # AS1's parts across its six exports, each component written alone: the
      # same checks, with the tallies pinned (KO8).
      - run: tools/verify-occt.py match --expect fixtures/manifest.json fixtures
      # In release: the corpus's match runs take most of an hour unoptimised.
      - run: cargo test --release -p fitment --test corpus --test fixtures --test shortlist --test original --test matching --test catalog_corpus --test observer --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
          FITMENT_REQUIRE_FIXTURES: "1"
      # Every corpus file uploads under the SHA-256 the test computes
      # (docs/research/m6-api.md, PR 4's "done when"; UP2, CO1).
      - run: cargo test --release -p fitment-server --test api --locked every_corpus_file_uploads_with_its_sha256
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # Every corpus assembly's fitment.parts and socket through jobs are
      # the CLI's bytes (docs/research/m6-api.md, PR 5's "done when"; DC1,
      # JB4).
      - run: cargo test --release -p fitment-server --test parity --locked every_corpus_source_is_the_clis_through_jobs
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # The library's report (KH6), which the API's must equal from M6's
      # PR 6 on (docs/research/m6-api.md, XH6, VT3).
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: target/fitment-corpus/report.json
          retention-days: 7
          if-no-files-found: error

  server-corpus:
    name: the corpus through the API
    # VT1, VT2, VT3 (docs/research/m6-api.md, XH1 to XH11, M6-36): the
    # exit's file half and its catalog half (XH8: the corpus ingested, its
    # full, exhaustive and named runs under three policies the CLI's on the
    # server's catalog, `verify --deep` clean after) through the built
    # server, a child over loopback, in release; the API's report must
    # equal the library's, byte for byte.
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - uses: actions/download-artifact@v8
        with:
          name: corpus-report
          path: library-report
      - run: cargo build --release -p fitment -p fitment-server --locked
      - run: cargo test --release -p fitment-server --test exit --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # VT22: the hostile parts as uploaded candidates, the CLI's bytes.
      - run: cargo test --release -p fitment-server --test hostile --locked hostile_parts_through_the_api_are_the_clis
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      - run: diff library-report/report.json target/fitment-corpus/api-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: target/fitment-corpus/api-report.json
          retention-days: 7
          if-no-files-found: error

  unit-set:
    name: unit set matches the generator
    # Its own job, so that a difference shows here without holding back
    # every test job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      # The same files, but for the last digit of a number: Open CASCADE's
      # trigonometry rounds by the platform's maths library.
      - run: tools/gen-corpus.py --unit-set "$RUNNER_TEMP/unit" --check crates/fitment-core/tests/data
      - run: tools/gen-corpus.py --assembly-set "$RUNNER_TEMP/assemblies" --check crates/fitment-core/tests/assemblies
      - run: tools/gen-corpus.py --candidate-set "$RUNNER_TEMP/candidates" --check crates/fitment-core/tests/candidates

  test:
    name: test (${{ matrix.os }})
    # The generated corpus runs on every OS from the artifact, without Python.
    needs: corpus-gen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - run: cargo test --workspace --all-features --locked
        env:
          FITMENT_REQUIRE_CORPUS: "1"
      # VT36: the OpenAPI document is the committed one, and every document
      # validates against its schema; behind the `schema` feature, so named
      # explicitly (docs/research/m6-api.md, section 11.2).
      - run: cargo test -p fitment-server --features schema --test openapi --locked
      # VT8: the API's own documents, compared across the three operating
      # systems by the determinism job.
      - run: tools/api-outputs.sh api-outputs
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: api-outputs-${{ matrix.os }}
          path: api-outputs
          retention-days: 7
          if-no-files-found: error
      # CT7: one ingest sequence's catalog outputs, compared across the three
      # operating systems by the determinism job.
      - run: cargo build -p fitment --locked
      - run: tools/catalog-outputs.sh catalog-outputs
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-outputs-${{ matrix.os }}
          path: catalog-outputs
          retention-days: 7
          if-no-files-found: error

  fit-kernel:
    name: fit kernel (${{ matrix.os }})
    # M7's real helper (docs/research/m7-fit.md, section 11, PR 2b; M7-26):
    # `fitment fit setup`'s internals make a fit directory with uv (the only
    # download), and the embedded helper, spawned from its manifest, speaks
    # to Open CASCADE: VT74's uv half (the manifest, the handshake, the
    # self-test, the limits each OS takes), VT71 (hostile files handed
    # directly, an exception in one pair, a killed helper leaves no process),
    # VT70 (its own CPU and memory bounds end it) and s01 (the lug
    # interferes, the bracket verifies), and from PR 3 the same through the
    # CLI with VT64's catalog run. Until the weekly Windows corpus run
    # is green (VT77), Windows' helper is refused (M7-50): there the job
    # checks setup, the handshake and the refusal, not verification.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The oracle job's uv, pinned as it pins it.
      - uses: astral-sh/setup-uv@v10.1.0
      # FH6, decision 11: the helper's pin and the oracle's are the same
      # cadquery-ocp-novtk.
      - name: The helper's pin is the oracle's
        shell: bash
        run: |
          pin() { grep -m1 '^# dependencies = ' "$1" | grep -o 'cadquery-ocp-novtk==[^"]*'; }
          helper=$(pin crates/fitment-fit/helper/fit_helper.py)
          oracle=$(pin tools/verify-occt.py)
          echo "helper: $helper; oracle: $oracle"
          test -n "$helper" && test "$helper" = "$oracle"
      # In release: the matcher's interface and freedom take most of a debug
      # build's time per candidate.
      - run: cargo test --release -p fitment-fit --test kernel --locked -- --nocapture
        env:
          FITMENT_FIT_KERNEL: "1"
      # PR 3: the CLI with the real helper: `fitment fit setup` as a user
      # runs it (VT74's CLI half), s01's lug and bracket through `match
      # --fit`, a component of another assembly (FB5) and VT64, a catalog
      # run with the fit equal to the file run over level 1's survivors.
      - run: cargo test --release -p fitment --test fit_kernel --locked -- --nocapture
        env:
          FITMENT_FIT_KERNEL: "1"

  fit:
    name: fit (${{ matrix.os }})
    # M7's PR 4 (docs/research/m7-fit.md, section 7; M7-26): the corpus with
    # the real helper, PR-gating on Ubuntu and macOS, from corpus-gen's
    # artifact. VT58, VT60 and VT63: every match case under both policies,
    # the library path one session per source assembly, the binary path on
    # the committed candidates, the collides cases and FK2's with one
    # helper; FK1's truths, FK2's stated fits and the fit baseline (FK6);
    # every document again in reverse with a fresh helper per check. VT59:
    # every corpus and fixture original's control (FK4, FK5). Each OS's
    # report, documents and digests are uploaded; fit-digests compares the
    # digests and fit-oracle checks Ubuntu's documents (VT63, VT72).
    # Windows' corpus is weekly (scale.yml's fit-windows, VT77).
    needs: corpus-gen
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The oracle job's uv, pinned as it pins it.
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - name: Cache fixtures
        uses: actions/cache@v6
        with:
          path: |
            fixtures/nist
            fixtures/nist-edm
            fixtures/steptools
          key: fixtures-${{ hashFiles('tools/fetch-fixtures.sh') }}
      - run: tools/fetch-fixtures.sh core
        shell: bash
      - run: cargo build --release -p fitment --locked
      # The only step that downloads: Python and the locked wheels.
      - run: target/release/fitment fit setup --fit-dir "$RUNNER_TEMP/fit"
        shell: bash
      - run: cargo test --release -p fitment --test fit_corpus --test fit_original --locked -- --nocapture --test-threads 1
        shell: bash
        env:
          FITMENT_REQUIRE_FIT: "1"
          FITMENT_REQUIRE_CORPUS: "1"
          FITMENT_REQUIRE_FIXTURES: "1"
          FITMENT_FIT_DIR: ${{ runner.temp }}/fit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fit-${{ matrix.os }}
          path: |
            target/fitment-corpus/fit
            target/fitment-corpus/fit-report.json
            target/fitment-corpus/fit-digests.json
            target/fitment-corpus/fit-originals.json
          retention-days: 7
          if-no-files-found: error

  fit-digests:
    name: the fit's digests equal on Ubuntu and macOS
    # VT63, FM5: every v2 document's digest, which leaves out the kernel's
    # measured numbers and keeps every decision, is the same on both OSes.
    needs: fit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fit-*
      - run: diff fit-ubuntu-latest/fit-digests.json fit-macos-latest/fit-digests.json

  fit-oracle:
    name: the oracle on the fit's documents
    # VT72 (FO1 to FO3): every Match physically clear of every neighbour and
    # copy outside the oracle's own zones at t, at every excused turn; every
    # interference re-measured at its pair's depth; every collides case
    # colliding at its construction's placement; each mutation of a v2
    # document met somewhere. On Ubuntu's documents.
    needs: [corpus-gen, fit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8
        with:
          name: corpus
          path: corpus/out
      - uses: actions/download-artifact@v8
        with:
          name: fit-ubuntu-latest
          path: fit-ubuntu
      - run: cargo build --release -p fitment --locked
      - run: tools/verify-occt.py fit corpus/out fit-ubuntu/fit

  fit-gate:
    name: fit gate
    # One check for the fit's jobs (the reviews of M7's PR 4): it fails if
    # corpus-gen, either fit leg, the digests' comparison or the oracle on
    # the fit's documents failed, was cancelled or was skipped, so a single
    # required status covers them all. Making it required is a repository
    # setting, the user's to choose.
    needs: [corpus-gen, fit, fit-digests, fit-oracle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every fit job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a fit job ended $r"
              exit 1
            fi
          done

  determinism:
    name: catalog and API outputs equal on every OS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: catalog-outputs-*
      - run: diff -r catalog-outputs-ubuntu-latest catalog-outputs-macos-latest
      - run: diff -r catalog-outputs-ubuntu-latest catalog-outputs-windows-latest
      # VT8 (docs/research/m6-api.md): the API's documents, byte for byte.
      - uses: actions/download-artifact@v8
        with:
          pattern: api-outputs-*
      - run: diff -r api-outputs-ubuntu-latest api-outputs-macos-latest
      - run: diff -r api-outputs-ubuntu-latest api-outputs-windows-latest

  container:
    name: container image
    # VT29 (docs/research/m6-api.md; OP8, M6-43): the image as shipped,
    # built without test seams and smoke-tested; pushed only by the user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Containerfile -t fitment-server:ci .
      - run: deploy/smoke.sh fitment-server:ci

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # rust-toolchain.toml pins stable, and it outranks the toolchain the step
      # above installs unless RUSTUP_TOOLCHAIN is set. Without this, the job
      # checks with stable and passes vacuously.
      - name: Use the MSRV toolchain over rust-toolchain.toml
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.name }}" >> "$GITHUB_ENV"
      - name: Assert the MSRV toolchain is active
        run: rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }}\." || { rustc --version; exit 1; }
      - uses: Swatinem/rust-cache@v2
      # fitment-server states its own, higher rust-version: the next job.
      - run: cargo check --workspace --exclude fitment-server --all-features --locked

  # fitment-server's own rust-version (1.87, for RUSTSEC-2026-0385's fix in
  # argon2's ctutils): it is never published, and its image builds with it.
  msrv-server:
    name: MSRV (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from fitment-server's Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' crates/fitment-server/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Use the MSRV toolchain over rust-toolchain.toml
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.name }}" >> "$GITHUB_ENV"
      - name: Assert the MSRV toolchain is active
        run: rustc --version | grep -q "^rustc ${{ steps.msrv.outputs.version }}\." || { rustc --version; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p fitment-server --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both crates packaged as crates.io would take them, and each built from
      # its .crate: fitment against fitment-core's through Cargo's local
      # registry overlay (docs/research/m4-match.md, section 22.1).
      # fitment-corpus and fitment-server are never published
      # (docs/research/m6-api.md, SC3, M6-35), and `cargo package` does not
      # skip either by itself.
      - run: cargo package --workspace --exclude fitment-corpus --exclude fitment-server --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary rather than EmbarkStudios/cargo-deny-action, which
      # builds a Docker image and fails when Docker Hub rate-limits the pull.
      # Pinned so a new cargo-deny cannot change what the configs mean.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
      # fitment-core: its dependency allowlist (alone and as the workspace
      # builds it), banned std modules, async code and global state.
      - name: fitment-core checks
        run: tools/check-core.sh
