# VT26 (docs/research/m6-api.md, M6-42): the API's two fuzz targets, and
# VT75 (docs/research/m7-fit.md): the fit helper's frames, run by
# `cargo fuzz` on a nightly toolchain in `.github/workflows/fuzz.yml`.
# Its own workspace, so the repository's (stable, MSRV 1.85) never builds
# it and its lock stays apart.
[package]
name = "fitment-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fitment-server = { path = "../crates/fitment-server", features = ["test-support"] }
fitment-catalog = { path = "../crates/fitment-catalog" }
fitment-fit = { path = "../crates/fitment-fit", features = ["test-support"] }

[workspace]
members = ["."]

# The route target: a request through the router in process (VT26).
[[bin]]
name = "route"
path = "fuzz_targets/route.rs"
test = false
doc = false
bench = false

# The body target: each request type's decoding and validation (VT26).
[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
bench = false

# The frames target: the fit helper's frame reader and reply decoders (VT75).
[[bin]]
name = "fit_frames"
path = "fuzz_targets/fit_frames.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
